    - test timeseries stack 1 file:
          params:
              files:
                  ["s3://kfbx-opera-disp-test-bucket/20221107_20221213.unw.nc"]
              lat: 38.57
              lon: -121.53
          response:
              status_code: 200
              expected_output:
                {
                    "20221107_20221213.unw.nc": {
