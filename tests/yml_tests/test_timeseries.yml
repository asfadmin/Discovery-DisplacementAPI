tests:
  - test timeseries stack 14 files:
      params:
        file_store: s3://kfbx-opera-disp-test-bucket/11114.json
        lat: 38.57
        lon: -121.53
      response:
        status_code: 200
        expected_output: sample_point_stack_data.yml

  - test timeseries stack 3 files out-of-bounds lat lon:
      params:
        file_store: s3://kfbx-opera-disp-test-bucket/11114.json
        lat: 0
        lon: 0
      response:
        status_code: 200
        expected_output: sample_point_stack_nodata.yml

  - test timeseries empty files:
      params:
        file_store: ""
        lat: 0.0
        lon: 0.0
      response:
        status_code: 422

