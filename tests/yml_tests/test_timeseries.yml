tests:
  - test timeseries ridgecrest CA quake ASCENDING:
      params:
        bucket: asf-cumulus-prod-opera-products
        wkt: POINT(-117.69124803858051 35.84163695732987)
        flightDirection: ASCENDING
      response:
        status_code: 200
        expected_output: ridgecrest_ca_quake_ascending.yml

  - test timeseries ridgecrest CA quake DESCENDING:
      params:
        bucket: asf-cumulus-prod-opera-products
        wkt: POINT(-117.69124803858051 35.84163695732987)
        flightDirection: DESCENDING
      response:
        status_code: 200
        expected_output: ridgecrest_ca_quake_descending.yml

  - test timeseries empty files:
      params:
        bucket: ""
        wkt: POINT (0 0)
      response:
        status_code: 400

