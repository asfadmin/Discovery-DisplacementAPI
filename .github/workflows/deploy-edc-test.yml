name: HDFReaderAPI deploy action (edc-test)

on:
  push:
    branches:
      - test

jobs:
  deploy-lambda:
    runs-on: ubuntu-latest
    environment: edc-test
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: build lambda stack
        uses: ./.github/workflows/hdf-reader-api-composite
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          vpc-id: ${{ secrets.VPC_ID }}
          subnet-ids: ${{ secrets.SUBNET_IDS }}
          security-group: ${{ secrets.SECURITY_GROUP}}
          stack-id: CdkOperaDispStack

  deploy-fargate:
    runs-on: ubuntu-latest
    environment: edc-test
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: build fargate stack
        uses: ./.github/workflows/hdf-reader-api-composite
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          vpc-id: ${{ secrets.VPC_ID }}
          subnet-ids: ${{ secrets.SUBNET_IDS }}
          security-group: ${{ secrets.SECURITY_GROUP}}
          stack-id: CdkFargateOperaDispStack