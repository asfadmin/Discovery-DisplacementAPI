name: HDFReaderAPI deploy action (prod)

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: build
        uses: ./.github/workflows/hdf-reader-api-composite
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
