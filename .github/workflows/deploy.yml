# Largely pulled from Santiago Garcia Arango
# https://github.com/san99tiago/aws-fastapi-lambda/blob/main/.github/workflows/deploy.yml
name: deploy

on:
  push:
    branches: [ 'test', 'prod', 'feature/**']
    tags: [ 'v*']
env:
  AWS_DEFAULT_REGION: us-west-2
  AWS_DEFAULT_OUTPUT: json

# installs dependencies to run cdk
# then synthesizes and deploys the stack
jobs:
  cdk-synth:
    name: CDK Synth
    runs-on: ubuntu-latest
    # needs: code-quality
    permissions:
      id-token: write  # This is required for requesting the JWT
      contents: read  # This is required for actions/checkout
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Dependencies
        run: |
           python3 -m pip install --upgrade pip
           python3 -m pip install .
           - name: Run Tests
           run: python3 -m pytest -n auto

      - name: Set up NodeJs
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install CDK
        run: |
          npm install -g aws-cdk

      # # MY OLD AUTH CONFIG (NOW WITH GITHUB OIDC TOKEN)
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@master
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
      #     aws-region: "us-east-1"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: myGitHubActions

      # Sample STS get caller identity for tests
    #   - name: sts get-caller-identity
    #     run: |
    #       aws sts get-caller-identity

    #   - name: Synth CDK to CloudFormation Template
    #     run: |
    #       source .venv/bin/activate
    #       cdk synth

      - name: Archive CDK Synth results (no assets)
        uses: actions/upload-artifact@v3
        with:
          name: cdk-synth-folder
          path: |
            ./cdk.out
            !./cdk.out/asset.*
          retention-days: 1

  cdk-deploy:
    name: Deploy CDK
    runs-on: ubuntu-latest
    # needs: iac-checkov
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write  # This is required for requesting the JWT
      contents: read  # This is required for actions/checkout
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Install Poetry dependencies
        run: poetry install --no-interaction

      - name: Set up NodeJs
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install CDK
        run: npm install -g aws-cdk

      # # MY OLD AUTH CONFIG (NOW WITH GITHUB OIDC TOKEN)
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@master
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
      #     aws-region: "us-east-1"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: myGitHubActions

      # NOTE: for now no manual approvals are required
      - name: Deploy to AWS
        run: |
          source .venv/bin/activate
          cdk deploy --require-approval=never